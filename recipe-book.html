<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recipe Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDEDE6;
  --card:#FFFFFF;
  --ink:#1B2620;
  --soft:#5A6862;
  --line:#D3D5CB;
  --line-strong:#B6BAAE;
  --spruce:#2F5D50;
  --plum:#6B3A62;
  --ochre:#B5811A;
  --leaf:#3F6B3A;
  --fiber:#7A8B84;
  --warn:#8C3B2E;
  --r:4px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px 80px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0;line-height:1.15}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--spruce);outline-offset:2px}

/* masthead */
.masthead{padding:34px 0 20px;border-bottom:2px solid var(--ink)}
.masthead h1{font-size:clamp(30px,6vw,46px);letter-spacing:-0.02em}
.masthead p{margin:8px 0 0;color:var(--soft);max-width:56ch}
.mast-row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.mast-actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{
  background:var(--card);border:1px solid var(--line-strong);color:var(--ink);
  padding:8px 14px;border-radius:var(--r);
}
.btn:hover{border-color:var(--ink)}
.btn-primary{background:var(--spruce);border-color:var(--spruce);color:#F4F6F2}
.btn-primary:hover{background:#26493F;border-color:#26493F}
.btn-danger{color:var(--warn);border-color:#D8C3BE}
.btn-danger:hover{border-color:var(--warn)}
.btn-sm{padding:5px 10px;font-size:13px}

/* filters */
.filters{padding:18px 0;border-bottom:1px solid var(--line)}
.filter-line{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.filter-line + .filter-line{margin-top:12px}
.search{
  flex:1 1 240px;min-width:200px;background:var(--card);
  border:1px solid var(--line-strong);border-radius:var(--r);padding:9px 12px;
}
select.control{background:var(--card);border:1px solid var(--line-strong);border-radius:var(--r);padding:8px 10px}
.numfield{display:flex;align-items:center;gap:6px;color:var(--soft);font-size:13px}
.numfield input{width:78px;background:var(--card);border:1px solid var(--line-strong);border-radius:var(--r);padding:7px 8px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  background:transparent;border:1px solid var(--line-strong);border-radius:999px;
  padding:5px 12px;font-size:13px;color:var(--soft);
}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.result-count{color:var(--soft);font-size:13px;padding:14px 0 0}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:16px}
.recipe{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  border-top:3px solid var(--spruce);
  padding:16px 16px 14px;text-align:left;display:flex;flex-direction:column;gap:10px;width:100%;
}
.recipe:hover{border-color:var(--line-strong);border-top-color:inherit}
.recipe h3{font-size:20px;letter-spacing:-0.01em}
.recipe .kind{font-size:13px;color:var(--soft)}
.energy{display:flex;align-items:baseline;gap:8px;margin-top:2px}
.energy b{font-family:Fraunces,Georgia,serif;font-size:32px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.energy span{font-size:13px;color:var(--soft)}
.bar{display:flex;height:7px;border-radius:2px;overflow:hidden;background:#E4E6DF}
.bar i{display:block;height:100%}
.macro-line{display:flex;gap:14px;font-size:13px;font-variant-numeric:tabular-nums;color:var(--soft);flex-wrap:wrap}
.macro-line em{font-style:normal;color:var(--ink);font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:1px}
.tagrow{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:12px;color:var(--soft);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.stars{color:var(--ochre);letter-spacing:2px;font-size:14px}
.stars.empty{color:var(--line-strong)}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px;margin-top:auto}
.made{font-size:12px;color:var(--soft)}

.empty{
  border:1px dashed var(--line-strong);border-radius:var(--r);padding:44px 24px;text-align:center;margin-top:24px;
}
.empty h2{font-size:22px}
.empty p{color:var(--soft);margin:8px auto 16px;max-width:44ch}

/* dialog */
dialog{
  border:none;padding:0;background:transparent;max-width:760px;width:calc(100% - 24px);
}
dialog::backdrop{background:rgba(27,38,32,.55)}
.sheet{
  background:var(--card);border-radius:var(--r);border:1px solid var(--line-strong);
  max-height:88vh;overflow:auto;
}
.sheet-head{
  position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);
  padding:18px 22px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;
}
.sheet-body{padding:20px 22px 26px}
.sheet h2{font-size:26px;letter-spacing:-0.015em}
.sheet-sub{color:var(--soft);font-size:13px;margin-top:4px}
.close{background:none;border:none;font-size:24px;line-height:1;color:var(--soft);padding:2px 6px}
.close:hover{color:var(--ink)}

.section-title{font-family:Fraunces,Georgia,serif;font-size:17px;font-weight:600;margin:22px 0 8px}
.section-title:first-child{margin-top:0}
ul.ing{list-style:none;margin:0;padding:0}
ul.ing li{display:flex;gap:12px;padding:5px 0;border-bottom:1px dotted var(--line)}
ul.ing li .qty{min-width:82px;font-variant-numeric:tabular-nums;font-weight:500}
ol.steps{margin:0;padding-left:20px}
ol.steps li{margin-bottom:10px;max-width:70ch}
.macro-table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin-top:6px}
.macro-table th,.macro-table td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--line);font-weight:400}
.macro-table th{color:var(--soft);font-size:12px;font-weight:500}
.macro-table td:first-child,.macro-table th:first-child{text-align:left}
.macro-table tr.total td{font-weight:600}
.scaler{display:flex;align-items:center;gap:10px;margin:14px 0 4px;color:var(--soft);font-size:13px}
.scaler input{width:70px;background:var(--paper);border:1px solid var(--line-strong);border-radius:var(--r);padding:6px 8px;font-variant-numeric:tabular-nums}
.logline{display:flex;gap:12px;padding:7px 0;border-bottom:1px dotted var(--line);font-size:14px}
.logline time{color:var(--soft);min-width:90px;font-variant-numeric:tabular-nums}
.rate-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.star-btn{background:none;border:none;font-size:24px;color:var(--line-strong);padding:0 2px;line-height:1}
.star-btn.on{color:var(--ochre)}
.sheet-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}

/* form */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--soft);margin-bottom:5px}
.field input,.field select,.field textarea{
  width:100%;background:var(--paper);border:1px solid var(--line-strong);
  border-radius:var(--r);padding:9px 11px;
}
.field textarea{min-height:88px;resize:vertical;line-height:1.5}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row > .field{flex:1 1 140px;margin-bottom:14px}
.ing-row{display:flex;gap:8px;margin-bottom:7px;align-items:center}
.ing-row input.amt{width:78px;flex:none}
.ing-row select.unit{width:82px;flex:none}
.ing-row input.nm{flex:1 1 auto;min-width:120px}
.ing-row input,.ing-row select{background:var(--paper);border:1px solid var(--line-strong);border-radius:var(--r);padding:8px 9px}
.icon-btn{background:none;border:1px solid var(--line-strong);border-radius:var(--r);color:var(--soft);padding:6px 9px;line-height:1}
.icon-btn:hover{color:var(--warn);border-color:var(--warn)}
.group{border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px}
.group-head{display:flex;gap:8px;margin-bottom:10px}
.group-head input{flex:1;background:var(--paper);border:1px solid var(--line-strong);border-radius:var(--r);padding:8px 10px;font-weight:500}
.hint{font-size:12px;color:var(--soft);margin-top:5px}
.foot{margin-top:44px;padding-top:16px;border-top:1px solid var(--line);color:var(--soft);font-size:13px;max-width:62ch}
.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:var(--r);
  font-size:14px;opacity:0;pointer-events:none;transition:opacity .18s;z-index:99;
}
.toast.show{opacity:1}
.brandtag{
  display:inline-block;margin-left:8px;font-size:11px;color:var(--soft);
  border:1px solid var(--line);border-radius:999px;padding:1px 8px;vertical-align:1px;
}
.link-row{display:flex;align-items:center;gap:10px;margin:0 0 12px 0;flex-wrap:wrap}
.link-row select.ref{
  flex:1 1 180px;min-width:0;background:var(--paper);border:1px solid var(--line);
  border-radius:var(--r);padding:6px 8px;font-size:13px;color:var(--soft);
}
.calcnote{font-size:12px;color:var(--soft);font-variant-numeric:tabular-nums}
.calcnote.bad{color:var(--warn)}
.warnbox{
  border-left:3px solid var(--ochre);background:#FAF6EC;padding:9px 12px;
  font-size:13px;margin-top:8px;border-radius:0 var(--r) var(--r) 0;
}
.pantry-row{
  display:block;width:100%;text-align:left;background:var(--card);
  border:none;border-bottom:1px solid var(--line);padding:12px 4px;
}
.pantry-row:hover{background:var(--paper)}
.pantry-row strong{font-weight:500}
.pantry-macros{display:block;font-size:12px;color:var(--soft);font-variant-numeric:tabular-nums;margin-top:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:560px){
  .masthead{padding-top:24px}
  .sheet-head,.sheet-body{padding-left:16px;padding-right:16px}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div class="mast-row">
      <div>
        <h1>Recipe Book</h1>
        <p id="mastSummary">Loading your recipes.</p>
      </div>
      <div class="mast-actions">
        <button class="btn btn-primary" id="addBtn">Add recipe</button>
        <button class="btn" id="pantryBtn">Pantry</button>
        <button class="btn" id="exportBtn">Backup</button>
        <input type="file" id="importFile" accept="application/json" hidden>
      </div>
    </div>
  </header>

  <section class="filters" aria-label="Filter recipes">
    <div class="filter-line">
      <input class="search" id="q" type="search" placeholder="Search names, ingredients, tags" aria-label="Search recipes">
      <select class="control" id="sort" aria-label="Sort recipes">
        <option value="updated">Recently updated</option>
        <option value="name">Name A–Z</option>
        <option value="rating">Highest rated</option>
        <option value="kcal">Fewest calories per serving</option>
        <option value="protein">Most protein per serving</option>
        <option value="made">Most made</option>
      </select>
      <div class="numfield"><label for="maxKcal">Max kcal/serving</label><input id="maxKcal" type="number" min="0" step="10" placeholder="any"></div>
      <div class="numfield"><label for="minPro">Min protein/serving</label><input id="minPro" type="number" min="0" step="1" placeholder="any"></div>
      <select class="control" id="minRating" aria-label="Minimum rating">
        <option value="0">Any rating</option>
        <option value="5">5 stars</option>
        <option value="4">4+ stars</option>
        <option value="3">3+ stars</option>
        <option value="-1">Not made yet</option>
      </select>
    </div>
    <div class="filter-line" id="typeChips" role="group" aria-label="Filter by type"></div>
    <div class="filter-line" id="tagChips" role="group" aria-label="Filter by tag"></div>
    <div class="result-count" id="count"></div>
  </section>

  <main id="grid" class="grid"></main>
  <div id="empty" class="empty" hidden></div>

  <footer class="foot">
    <p id="storageNote"></p>
    <p>Tap Backup to see everything as text. Copy it and keep it somewhere — that text is your safety net, and it pastes straight back in.</p>
  </footer>
</div>

<dialog id="viewDlg"><div class="sheet" id="viewSheet"></div></dialog>
<dialog id="editDlg"><div class="sheet" id="editSheet"></div></dialog>
<dialog id="dataDlg"><div class="sheet" id="dataSheet"></div></dialog>
<dialog id="pantryDlg"><div class="sheet" id="pantrySheet"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

/* ---------- storage: widget store -> localStorage -> memory ---------- */
const KEY = "recipeBook:v1";
const mem = {};
const backend = (() => {
  if (typeof window !== "undefined" && window.storage && typeof window.storage.get === "function") {
    return {
      name: "cloud",
      async get(){ try { const r = await window.storage.get(KEY); return r ? r.value : null; } catch(e){ return null; } },
      async set(v){ await window.storage.set(KEY, v); }
    };
  }
  try {
    localStorage.setItem("__t","1"); localStorage.removeItem("__t");
    return {
      name: "local",
      async get(){ return localStorage.getItem(KEY); },
      async set(v){ localStorage.setItem(KEY, v); }
    };
  } catch(e){
    return { name:"memory", async get(){ return mem[KEY] || null; }, async set(v){ mem[KEY]=v; } };
  }
})();

const STORAGE_NOTE = {
  cloud: "Recipes are saved to this app's storage and will be here next time you open it.",
  local: "Recipes are saved in this browser on this device. Open the same file on the same browser and they'll be waiting.",
  memory: "Storage is blocked in this context, so recipes will vanish on refresh. Download the file and open it locally to keep them."
};

/* ---------- model ---------- */
const TYPES = ["Breakfast","Main","Side","Dessert","Snack","Sauce","Drink","Bread","Prep"];
const TYPE_COLOR = {
  Breakfast:"#B5811A", Main:"#2F5D50", Side:"#4F6B87", Dessert:"#6B3A62",
  Snack:"#8A5A2B", Sauce:"#7A4B4B", Drink:"#3F6B8A", Bread:"#6E5B2E", Prep:"#556158"
};
const UNITS = ["g","ml","tbsp","tsp","cup","oz","pcs","scoop",""];
const TO_G = { g:1, oz:28.3495 };
const TO_ML = { ml:1, tsp:4.93, tbsp:14.79, cup:236.6 };

let recipes = [];
let pantry = [];
let filters = { q:"", types:new Set(), tags:new Set(), sort:"updated", maxKcal:null, minPro:null, minRating:0 };

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const today = () => new Date().toISOString().slice(0,10);
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r1 = n => Math.round(n*10)/10;
const ZERO = () => ({kcal:0,protein:0,fat:0,carbs:0,fiber:0});

const pantryItem = id => pantry.find(p => p.id === id);
const pantryLabel = p => p.brand ? `${p.name} — ${p.brand}` : p.name;
const BASIS_LABEL = { "100g":"per 100 g", "100ml":"per 100 ml", "each":"per piece" };

/* How much of a pantry item one ingredient row represents.
   Returns a multiplier on the item's per-100 (or per-piece) numbers,
   or null if the units can't be reconciled. */
function factorFor(item, p){
  const amt = num(item.amount);
  if (!amt || !p) return null;
  const u = item.unit;
  if (p.basis === "100g")  return TO_G[u]  ? amt * TO_G[u]  / 100 : null;
  if (p.basis === "100ml") return TO_ML[u] ? amt * TO_ML[u] / 100 : null;
  if (p.basis === "each")  return (u === "pcs" || u === "") ? amt : null;
  return null;
}

/* Adds up every ingredient that's linked to a pantry item. */
function computeMacros(r){
  const totals = ZERO();
  const linked = [], unlinked = [], mismatched = [];
  (r.sections||[]).forEach(sec => (sec.items||[]).forEach(it => {
    if (!it.name) return;
    const p = it.ref ? pantryItem(it.ref) : null;
    if (!p) { unlinked.push(it.name); return; }
    const f = factorFor(it, p);
    if (f === null) { mismatched.push(`${it.name} (${it.unit||"no unit"} vs ${BASIS_LABEL[p.basis]})`); return; }
    linked.push(it.name);
    ["kcal","protein","fat","carbs","fiber"].forEach(k => totals[k] += num(p[k]) * f);
  }));
  return { totals, linked, unlinked, mismatched };
}

/* Whole-recipe macros: either typed in by hand or built from the pantry. */
function wholeMacros(r){
  if (r.macroMode === "auto") return computeMacros(r).totals;
  const m = r.macros || {};
  return { kcal:num(m.kcal), protein:num(m.protein), fat:num(m.fat), carbs:num(m.carbs), fiber:num(m.fiber) };
}

function perServing(r){
  const s = Math.max(1, num(r.servings) || 1);
  const m = wholeMacros(r);
  return {
    kcal: m.kcal/s, protein: m.protein/s,
    fat: m.fat/s, carbs: m.carbs/s, fiber: m.fiber/s
  };
}

/* Starter pantry. These are generic reference values, NOT label values —
   replace each one with the numbers off the package you actually buy. */
const BUILTIN_PANTRY = [
  { id:"p-flour-ap",    name:"All-purpose flour",       brand:"generic — verify label", basis:"100g",  kcal:364, protein:10.3, fat:1.0,  carbs:76.3, fiber:2.7 },
  { id:"p-flour-rice",  name:"Rice flour",              brand:"generic — verify label", basis:"100g",  kcal:366, protein:6.0,  fat:1.4,  carbs:80.1, fiber:2.4 },
  { id:"p-flour-coco",  name:"Coconut flour",           brand:"generic — verify label", basis:"100g",  kcal:400, protein:18.0, fat:13.0, carbs:60.0, fiber:39.0 },
  { id:"p-flour-spelt", name:"Spelt flour",             brand:"generic — verify label", basis:"100g",  kcal:338, protein:14.6, fat:2.4,  carbs:70.2, fiber:10.7 },
  { id:"p-sugar",       name:"Granulated sugar",        brand:"generic — verify label", basis:"100g",  kcal:387, protein:0,    fat:0,    carbs:100,  fiber:0 },
  { id:"p-butter",      name:"Unsalted butter",         brand:"generic — verify label", basis:"100g",  kcal:717, protein:0.9,  fat:81.1, carbs:0.1,  fiber:0 },
  { id:"p-cocoa",       name:"Cocoa powder, unsweetened",brand:"generic — verify label",basis:"100g",  kcal:228, protein:19.6, fat:13.7, carbs:57.9, fiber:37.0 },
  { id:"p-choc-chips",  name:"Semi-sweet chocolate chips",brand:"generic — verify label",basis:"100g", kcal:480, protein:4.2,  fat:30.0, carbs:63.0, fiber:5.9 },
  { id:"p-cream",       name:"Heavy cream",             brand:"generic — verify label", basis:"100ml", kcal:340, protein:2.8,  fat:36.0, carbs:2.8,  fiber:0 },
  { id:"p-egg",         name:"Egg, large (50g)",        brand:"generic — verify label", basis:"each",  kcal:72,  protein:6.3,  fat:4.8,  carbs:0.4,  fiber:0 },
  { id:"p-eggwhite",    name:"Egg whites",              brand:"generic — verify label", basis:"100g",  kcal:52,  protein:10.9, fat:0.2,  carbs:0.7,  fiber:0 },
  { id:"p-cottage-0",   name:"Cottage cheese, 0%",      brand:"generic — verify label", basis:"100g",  kcal:72,  protein:12.0, fat:0.3,  carbs:6.7,  fiber:0 },
  { id:"p-yog-fage0",   name:"Greek yogurt, 0%",        brand:"Fage Total",             basis:"100g",  kcal:59,  protein:10.3, fat:0,    carbs:3.6,  fiber:0 },
  { id:"p-yog-skyr",    name:"Skyr, plain nonfat",      brand:"generic — verify label", basis:"100g",  kcal:63,  protein:11.0, fat:0.2,  carbs:4.0,  fiber:0 },
  { id:"p-almondmilk",  name:"Almond milk, unsweetened",brand:"generic — verify label", basis:"100ml", kcal:15,  protein:0.6,  fat:1.2,  carbs:0.6,  fiber:0.2 },
  { id:"p-blueberries", name:"Blueberries",             brand:"generic — verify label", basis:"100g",  kcal:57,  protein:0.7,  fat:0.3,  carbs:14.5, fiber:2.4 },
  { id:"p-pumpkin",     name:"Pumpkin, cooked",         brand:"generic — verify label", basis:"100g",  kcal:20,  protein:0.7,  fat:0.1,  carbs:4.9,  fiber:1.1 },

let deleted = [];

async function load(){
  const raw = await backend.get();
  let saved = [], savedPantry = [];
  if (raw) {
    try {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) { saved = parsed; }
      else {
        saved = parsed.recipes || [];
        savedPantry = parsed.pantry || [];
        deleted = parsed.deleted || [];
      }
    } catch(e){ saved = []; }
  }
  const have = new Set(saved.map(r => r.id));
  BUILTIN.forEach(b => {
    if (!have.has(b.id) && !deleted.includes(b.id)) saved.push(JSON.parse(JSON.stringify(b)));
  });
  recipes = saved;

  const havePantry = new Set(savedPantry.map(p => p.id));
  BUILTIN_PANTRY.forEach(b => {
    if (!havePantry.has(b.id) && !deleted.includes(b.id)) savedPantry.push(JSON.parse(JSON.stringify(b)));
  });
  pantry = savedPantry;
}

async function save(showToast = true){
  try {
    await backend.set(JSON.stringify({ recipes, pantry, deleted }));
    if (showToast) toast(typeof showToast === "string" ? showToast : "Saved");
  } catch(e){
    toast("Could not save here — use Backup to keep a copy");
  }
}

/* ---------- rendering ---------- */
const $ = id => document.getElementById(id);

function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove("show"), 1900);
}

function starString(n){ return "★★★★★".slice(0,n) + "☆☆☆☆☆".slice(0,5-n); }

function macroBar(ps){
  const p = ps.protein*4, f = ps.fat*9, c = Math.max(0,(ps.carbs - ps.fiber))*4, fb = ps.fiber*2;
  const tot = p+f+c+fb || 1;
  const w = v => (v/tot*100).toFixed(1)+"%";
  return `<div class="bar" role="img" aria-label="Macro split by calories">
    <i style="width:${w(p)};background:var(--plum)"></i>
    <i style="width:${w(f)};background:var(--ochre)"></i>
    <i style="width:${w(c)};background:var(--leaf)"></i>
    <i style="width:${w(fb)};background:var(--fiber)"></i>
  </div>`;
}

function allTags(){
  const s = new Set();
  recipes.forEach(r => (r.tags||[]).forEach(t => s.add(t)));
  return [...s].sort((a,b)=>a.localeCompare(b));
}
function usedTypes(){
  const s = new Set(recipes.map(r => r.type).filter(Boolean));
  return [...s].sort((a,b)=>a.localeCompare(b));
}

function renderChips(){
  const tc = $("typeChips"), gc = $("tagChips");
  const types = usedTypes();
  tc.innerHTML = types.length
    ? `<div class="chips">` + types.map(t =>
        `<button class="chip" data-type="${esc(t)}" aria-pressed="${filters.types.has(t)}">${esc(t)}</button>`).join("") + `</div>`
    : "";
  const tags = allTags();
  gc.innerHTML = tags.length
    ? `<div class="chips">` + tags.map(t =>
        `<button class="chip" data-tag="${esc(t)}" aria-pressed="${filters.tags.has(t)}">${esc(t)}</button>`).join("") + `</div>`
    : "";
  tc.querySelectorAll("[data-type]").forEach(b => b.onclick = () => {
    const v = b.dataset.type;
    filters.types.has(v) ? filters.types.delete(v) : filters.types.add(v);
    render();
  });
  gc.querySelectorAll("[data-tag]").forEach(b => b.onclick = () => {
    const v = b.dataset.tag;
    filters.tags.has(v) ? filters.tags.delete(v) : filters.tags.add(v);
    render();
  });
}

function matches(r){
  const f = filters;
  if (f.types.size && !f.types.has(r.type)) return false;
  if (f.tags.size && ![...f.tags].every(t => (r.tags||[]).includes(t))) return false;
  const ps = perServing(r);
  if (f.maxKcal != null && ps.kcal > f.maxKcal) return false;
  if (f.minPro != null && ps.protein < f.minPro) return false;
  if (f.minRating === -1 && (r.rating||0) > 0) return false;
  if (f.minRating > 0 && (r.rating||0) < f.minRating) return false;
  if (f.q) {
    const hay = [r.name, r.type, (r.tags||[]).join(" "), r.notes,
      (r.sections||[]).map(s => s.title + " " + s.items.map(i => i.name).join(" ")).join(" ")
    ].join(" ").toLowerCase();
    if (!hay.includes(f.q.toLowerCase())) return false;
  }
  return true;
}

function sortList(list){
  const s = filters.sort;
  const by = {
    name: (a,b) => a.name.localeCompare(b.name),
    rating: (a,b) => (b.rating||0) - (a.rating||0) || a.name.localeCompare(b.name),
    kcal: (a,b) => perServing(a).kcal - perServing(b).kcal,
    protein: (a,b) => perServing(b).protein - perServing(a).protein,
    made: (a,b) => (b.timesMade||0) - (a.timesMade||0),
    updated: (a,b) => String(b.updated||"").localeCompare(String(a.updated||""))
  }[s];
  return list.slice().sort(by);
}

function render(){
  renderChips();
  const list = sortList(recipes.filter(matches));
  const grid = $("grid"), emptyBox = $("empty");

  const rated = recipes.filter(r => r.rating > 0).length;
  $("mastSummary").textContent = recipes.length === 0
    ? "Nothing in the book yet."
    : `${recipes.length} recipe${recipes.length===1?"":"s"} in the book, ${rated} rated after cooking.`;

  $("count").textContent = list.length === recipes.length
    ? `Showing all ${recipes.length}`
    : `Showing ${list.length} of ${recipes.length}`;

  if (!list.length) {
    grid.innerHTML = "";
    emptyBox.hidden = false;
    emptyBox.innerHTML = recipes.length
      ? `<h2>No recipes match those filters</h2><p>Loosen a filter or clear them to see the whole book.</p><button class="btn" id="clearF">Clear filters</button>`
      : `<h2>Start the book</h2><p>Add your first recipe with its ingredients, method and macros. Everything after that is filtering and rating.</p><button class="btn btn-primary" id="firstAdd">Add recipe</button>`;
    const cf = $("clearF"); if (cf) cf.onclick = clearFilters;
    const fa = $("firstAdd"); if (fa) fa.onclick = () => openEdit(null);
    return;
  }
  emptyBox.hidden = true;

  grid.innerHTML = list.map(r => {
    const ps = perServing(r);
    const color = TYPE_COLOR[r.type] || "var(--spruce)";
    const rating = r.rating > 0
      ? `<span class="stars" title="${r.rating} out of 5">${starString(r.rating)}</span>`
      : `<span class="made">Not made yet</span>`;
    return `<button class="recipe" data-id="${r.id}" style="border-top-color:${color}">
      <div>
        <div class="kind">${esc(r.type || "Uncategorised")}</div>
        <h3>${r.emoji ? esc(r.emoji)+" " : ""}${esc(r.name)}</h3>
      </div>
      <div class="energy"><b>${Math.round(ps.kcal)}</b><span>kcal per serving · ${esc(r.servings)} servings</span></div>
      ${macroBar(ps)}
      <div class="macro-line">
        <span><i class="dot" style="background:var(--plum)"></i>P <em>${r1(ps.protein)}g</em></span>
        <span><i class="dot" style="background:var(--ochre)"></i>F <em>${r1(ps.fat)}g</em></span>
        <span><i class="dot" style="background:var(--leaf)"></i>C <em>${r1(ps.carbs)}g</em></span>
        <span><i class="dot" style="background:var(--fiber)"></i>Fiber <em>${r1(ps.fiber)}g</em></span>
      </div>
      ${(r.tags||[]).length ? `<div class="tagrow">${r.tags.slice(0,4).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
      <div class="card-foot">${rating}<span class="made">${r.timesMade ? "Made "+r.timesMade+"×" : ""}</span></div>
    </button>`;
  }).join("");

  grid.querySelectorAll(".recipe").forEach(el => el.onclick = () => openView(el.dataset.id));
}

function clearFilters(){
  filters = { q:"", types:new Set(), tags:new Set(), sort:filters.sort, maxKcal:null, minPro:null, minRating:0 };
  $("q").value = ""; $("maxKcal").value = ""; $("minPro").value = ""; $("minRating").value = "0";
  render();
}

let viewId = null, scale = 1;

function openView(id){

function drawView(){
  const r = recipes.find(x => x.id === viewId);
  if (!r) return;
  const s = Math.max(1, num(r.servings)||1);
  const shownServings = r1(s * scale);
  const m = r.macros || {};
  const wm = wholeMacros(r);
  const ps = perServing(r);

  const ing = (r.sections||[]).map(sec => `
    <h3 class="section-title">${esc(sec.title || "Ingredients")}</h3>
    <ul class="ing">${(sec.items||[]).map(i => {
      const amt = i.amount === "" || i.amount == null ? "" : r1(num(i.amount)*scale);
      const p = i.ref ? pantryItem(i.ref) : null;
      return `<li><span class="qty">${amt !== "" ? amt + (i.unit ? " " + esc(i.unit) : "") : "—"}</span>
        <span>${esc(i.name)}${p && p.brand ? `<span class="brandtag">${esc(p.brand)}</span>` : ""}</span></li>`;
    }).join("")}</ul>`).join("");

  const steps = (r.steps||[]).length
    ? `<h3 class="section-title">Method</h3><ol class="steps">${r.steps.map(t=>`<li>${esc(t)}</li>`).join("")}</ol>`
    : "";

  const log = (r.log||[]).length
    ? `<h3 class="section-title">Changes and cooking notes</h3>` +
      r.log.slice().reverse().map(l => `<div class="logline"><time>${esc(l.date)}</time><span>${esc(l.note)}</span></div>`).join("")
    : "";

  $("viewSheet").innerHTML = `
    <div class="sheet-head">
      <div>
        <h2>${r.emoji ? esc(r.emoji)+" " : ""}${esc(r.name)}</h2>
        <div class="sheet-sub">${esc(r.type||"Uncategorised")} · ${esc(r.servings)} servings${r.lastMade ? " · last made "+esc(r.lastMade) : ""}</div>
      </div>
      <button class="close" id="vClose" aria-label="Close">×</button>
    </div>
    <div class="sheet-body">
      ${(r.tags||[]).length ? `<div class="tagrow" style="margin-bottom:16px">${r.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}

      <div class="scaler">
        <label for="scaleIn">Scale to</label>
        <input id="scaleIn" type="number" min="0.25" step="0.25" value="${shownServings}">
        <span>servings${scale !== 1 ? " (×"+r1(scale)+")" : ""}</span>
        ${scale !== 1 ? `<button class="btn btn-sm" id="resetScale">Reset</button>` : ""}
      </div>

      ${ing}
      ${steps}
      ${r.notes ? `<h3 class="section-title">Notes</h3><p style="max-width:70ch">${esc(r.notes)}</p>` : ""}

      <h3 class="section-title">Macros</h3>
      ${(() => {
        if (r.macroMode !== "auto") return `<p class="hint" style="margin:0 0 6px">Totals entered by hand.</p>`;
        const c = computeMacros(r);
        let note = `<p class="hint" style="margin:0 0 6px">Calculated from ${c.linked.length} linked ingredient${c.linked.length===1?"":"s"} in your pantry.</p>`;
        if (c.unlinked.length) note += `<div class="warnbox">Not counted, no pantry link: ${esc(c.unlinked.join(", "))}</div>`;
        if (c.mismatched.length) note += `<div class="warnbox">Unit mismatch, not counted: ${esc(c.mismatched.join("; "))}</div>`;
        return note;
      })()}
      <table class="macro-table">
        <thead><tr><th></th><th>kcal</th><th>Protein</th><th>Fat</th><th>Carbs</th><th>Fiber</th></tr></thead>
        <tbody>
          <tr><td>Per serving</td><td>${Math.round(ps.kcal)}</td><td>${r1(ps.protein)}g</td><td>${r1(ps.fat)}g</td><td>${r1(ps.carbs)}g</td><td>${r1(ps.fiber)}g</td></tr>
          <tr class="total"><td>Whole recipe</td><td>${Math.round(wm.kcal)}</td><td>${r1(wm.protein)}g</td><td>${r1(wm.fat)}g</td><td>${r1(wm.carbs)}g</td><td>${r1(wm.fiber)}g</td></tr>
        </tbody>
      </table>

      <h3 class="section-title">Your rating</h3>
      <div class="rate-row">
        <div id="starPick">${[1,2,3,4,5].map(n=>`<button class="star-btn ${n <= (r.rating||0) ? "on":""}" data-star="${n}" aria-label="${n} star${n>1?"s":""}">★</button>`).join("")}</div>
        <span class="made">${r.rating ? r.rating+"/5" : "Rate it after you cook it"}</span>
        <button class="btn btn-sm" id="madeBtn">Made it today${r.timesMade ? " ("+r.timesMade+" so far)" : ""}</button>
      </div>

      <h3 class="section-title">Changes and cooking notes</h3>
      ${(r.log||[]).length
        ? r.log.slice().reverse().map(l => `<div class="logline"><time>${esc(l.date)}</time><span>${esc(l.note)}</span></div>`).join("")
        : `<p class="made" style="margin:4px 0">Nothing logged yet. Tweaks and results go here with the date.</p>`}
      <div class="ing-row" style="margin-top:10px">
        <input class="nm" id="noteIn" placeholder="Cut sweetener in half, baked 25 min" aria-label="New note">
        <button class="btn btn-sm" id="noteAdd">Save note</button>
      </div>

      <div class="sheet-actions">
        <button class="btn btn-primary" id="editBtn2">Edit recipe</button>
        <button class="btn" id="dupBtn">Duplicate</button>
        <button class="btn btn-danger" id="delBtn">Delete</button>
      </div>
    </div>`;

  $("vClose").onclick = () => $("viewDlg").close();
  $("scaleIn").onchange = e => {
    const want = num(e.target.value);
    scale = want > 0 ? want / s : 1;
    drawView();
  };
  const rs = $("resetScale"); if (rs) rs.onclick = () => { scale = 1; drawView(); };

  $("starPick").querySelectorAll("[data-star]").forEach(b => b.onclick = async () => {
    const n = parseInt(b.dataset.star,10);
    r.rating = (r.rating === n) ? 0 : n;
    r.updated = today();
    await save(); drawView(); render();
  });

  $("madeBtn").onclick = async () => {
    r.timesMade = (r.timesMade||0) + 1;
    r.lastMade = today();
    r.updated = today();
    await save("Logged"); drawView(); render();
  };

  $("noteAdd").onclick = async () => {
    const box = $("noteIn");
    const note = box.value.trim();
    if (!note) { box.focus(); return; }
    r.log = r.log || [];
    r.log.push({ date: today(), note });
    r.updated = today();
    await save("Note saved");
    drawView();
  };
  $("noteIn").addEventListener("keydown", e => { if (e.key === "Enter") $("noteAdd").click(); });

  $("editBtn2").onclick = () => { $("viewDlg").close(); openEdit(r.id); };

  $("dupBtn").onclick = async () => {
    const copy = JSON.parse(JSON.stringify(r));
    copy.id = uid(); copy.name = r.name + " (variant)";
    copy.rating = 0; copy.timesMade = 0; copy.lastMade = null;
    copy.created = copy.updated = today(); copy.log = [];
    recipes.push(copy);
    await save("Duplicated");
    $("viewDlg").close(); render();
  };

  $("delBtn").onclick = async () => {
    const b = $("delBtn");
    if (b.dataset.armed !== "1") {
      b.dataset.armed = "1";
      b.textContent = "Tap again to delete";
      setTimeout(() => { if (b.isConnected) { b.dataset.armed = "0"; b.textContent = "Delete"; } }, 4000);
      return;
    }
    if (!deleted.includes(r.id)) deleted.push(r.id);
    recipes = recipes.filter(x => x.id !== r.id);
    await save("Deleted");
    $("viewDlg").close(); render();
  };
}

      <div class="chips" style="margin-bottom:12px">
        <button type="button" class="chip" id="modeManual" aria-pressed="${d.macroMode!=="auto"}">I'll type the totals</button>
        <button type="button" class="chip" id="modeAuto" aria-pressed="${d.macroMode==="auto"}">Calculate from pantry</button>
      </div>
      <div id="autoPanel" ${d.macroMode==="auto"?"":"hidden"}></div>
      <div id="manualPanel" ${d.macroMode==="auto"?"hidden":""}>
      <div class="row">
        <div class="field"><label for="mKcal">Calories</label><input id="mKcal" type="number" step="0.1" value="${esc(d.macros.kcal)}"></div>
        <div class="field"><label for="mPro">Protein (g)</label><input id="mPro" type="number" step="0.1" value="${esc(d.macros.protein)}"></div>
        <div class="field"><label for="mFat">Fat (g)</label><input id="mFat" type="number" step="0.1" value="${esc(d.macros.fat)}"></div>
        <div class="field"><label for="mCarb">Carbs (g)</label><input id="mCarb" type="number" step="0.1" value="${esc(d.macros.carbs)}"></div>
        <div class="field"><label for="mFib">Fiber (g)</label><input id="mFib" type="number" step="0.1" value="${esc(d.macros.fiber)}"></div>
      </div>
      <div class="hint" id="perServPreview"></div>
      <div style="margin-top:8px"><button class="btn btn-sm" id="fromServing">I only have per-serving numbers</button></div>
      </div>

      <div class="field" style="margin-top:22px"><label for="fNotes">Notes</label><textarea id="fNotes" placeholder="Pan size, substitutions, what to watch for">${esc(d.notes)}</textarea></div>

      ${editingId ? `<div class="field"><label for="fLog">What changed this time?</label><input id="fLog" placeholder="Cut sweetener in half, baked 25 min"><div class="hint">Optional. Saved with today's date so you can see how the recipe evolved.</div></div>` : ""}

      <div class="sheet-actions">
        <button class="btn btn-primary" id="saveBtn">${editingId ? "Save changes" : "Add to book"}</button>
        <button class="btn" id="cancelBtn">Cancel</button>
      </div>
    </div>`;

  drawSections();
  drawSteps();
  drawAutoPanel();
  updatePreview();

  $("modeManual").onclick = () => { pull(); draft.macroMode = "manual"; drawEdit(); };
  $("modeAuto").onclick = () => { pull(); draft.macroMode = "auto"; drawEdit(); };
  $("openPantry").onclick = () => { pull(); openPantry(true); };

  $("eClose").onclick = $("cancelBtn").onclick = () => $("editDlg").close();
  $("addSec").onclick = () => { pull(); draft.sections.push({title:"", items:[{amount:"",unit:"g",name:""}]}); drawEdit(); };
  $("addStep").onclick = () => { pull(); draft.steps.push(""); drawEdit(); };
  ["mKcal","mPro","mFat","mCarb","mFib","fServings"].forEach(id => {
    const el = $(id); if (el) el.oninput = () => { updatePreview(); if (id==="fServings") { draft.servings = num(el.value)||1; drawAutoPanel(); const op=$("openPantry"); if(op) op.onclick=()=>{pull();openPantry(true);}; } };
  });
  $("fromServing").onclick = () => {
    const s = Math.max(1, num($("fServings").value)||1);
    ["mKcal","mPro","mFat","mCarb","mFib"].forEach(id => {
      const v = num($(id).value);
      if (v) $(id).value = r1(v * s);
    });
    updatePreview();
    toast("Multiplied up to whole-recipe totals");
  };
  $("saveBtn").onclick = commit;
}

function drawAutoPanel(){
  const el = $("autoPanel");
  if (!el) return;
  const c = computeMacros(draft);
  const s = Math.max(1, num(draft.servings)||1);
  const t = c.totals;
  el.innerHTML = `
    <table class="macro-table">
      <thead><tr><th></th><th>kcal</th><th>Protein</th><th>Fat</th><th>Carbs</th><th>Fiber</th></tr></thead>
      <tbody>
        <tr class="total"><td>Whole recipe</td><td>${Math.round(t.kcal)}</td><td>${r1(t.protein)}g</td><td>${r1(t.fat)}g</td><td>${r1(t.carbs)}g</td><td>${r1(t.fiber)}g</td></tr>
        <tr><td>Per serving</td><td>${Math.round(t.kcal/s)}</td><td>${r1(t.protein/s)}g</td><td>${r1(t.fat/s)}g</td><td>${r1(t.carbs/s)}g</td><td>${r1(t.fiber/s)}g</td></tr>
      </tbody>
    </table>
    <p class="hint" style="margin-top:8px">Counting ${c.linked.length} of ${c.linked.length + c.unlinked.length + c.mismatched.length} ingredients.</p>
    ${c.unlinked.length ? `<div class="warnbox">No pantry link yet: ${esc(c.unlinked.join(", "))}</div>` : ""}
    ${c.mismatched.length ? `<div class="warnbox">Unit mismatch: ${esc(c.mismatched.join("; "))}</div>` : ""}
    <div style="margin-top:10px"><button class="btn btn-sm" id="openPantry">Open pantry</button></div>`;
}

function updatePreview(){
  if (!$("perServPreview") || draft.macroMode === "auto") return;
  const s = Math.max(1, num($("fServings").value)||1);
  const k = num($("mKcal").value)/s, p = num($("mPro").value)/s,
        f = num($("mFat").value)/s, c = num($("mCarb").value)/s, fb = num($("mFib").value)/s;
  $("perServPreview").textContent = `Per serving: ${Math.round(k)} kcal, ${r1(p)}g protein, ${r1(f)}g fat, ${r1(c)}g carbs, ${r1(fb)}g fiber.`;
}

function pantryOptions(selected){
  const sorted = pantry.slice().sort((a,b)=>pantryLabel(a).localeCompare(pantryLabel(b)));
  return `<option value="">— no pantry link —</option>` + sorted.map(p =>
    `<option value="${esc(p.id)}" ${p.id===selected?"selected":""}>${esc(pantryLabel(p))}</option>`).join("");
}

function drawSections(){
  const wrap = $("secWrap");
  wrap.innerHTML = draft.sections.map((sec, si) => `
    <div class="group" data-sec="${si}">
      <div class="group-head">
        <input class="sec-title" value="${esc(sec.title)}" placeholder="Section name, e.g. Base">
        ${draft.sections.length > 1 ? `<button class="icon-btn" data-delsec="${si}" aria-label="Remove section">Remove</button>` : ""}
      </div>
      ${sec.items.map((it, ii) => {
        const p = it.ref ? pantryItem(it.ref) : null;
        const f = p ? factorFor(it, p) : null;
        let calc = "";
        if (p && f !== null) calc = `<span class="calcnote">${Math.round(num(p.kcal)*f)} kcal, ${r1(num(p.protein)*f)}g protein</span>`;
        else if (p) calc = `<span class="calcnote bad">units don't match ${esc(BASIS_LABEL[p.basis])}</span>`;
        return `
        <div class="ing-item" data-item="${ii}">
          <div class="ing-row">
            <input class="amt" type="number" step="any" value="${esc(it.amount)}" placeholder="50" aria-label="Amount">
            <select class="unit" aria-label="Unit">${UNITS.map(u=>`<option value="${u}" ${u===it.unit?"selected":""}>${u||"—"}</option>`).join("")}</select>
            <input class="nm" value="${esc(it.name)}" placeholder="coconut flour" aria-label="Ingredient">
            <button class="icon-btn" data-delitem="${ii}" aria-label="Remove ingredient">×</button>
          </div>
          <div class="link-row">
            <select class="ref" aria-label="Link to pantry item">${pantryOptions(it.ref)}</select>
            ${calc}
          </div>
        </div>`;
      }).join("")}
      <button class="btn btn-sm" data-additem="${si}">Add ingredient</button>
    </div>`).join("");

  wrap.querySelectorAll("[data-additem]").forEach(b => b.onclick = () => {
    pull(); draft.sections[+b.dataset.additem].items.push({amount:"",unit:"g",name:"",ref:""}); drawEdit();
  });
  wrap.querySelectorAll("[data-delsec]").forEach(b => b.onclick = () => {
    pull(); draft.sections.splice(+b.dataset.delsec,1); drawEdit();
  });
  wrap.querySelectorAll("[data-delitem]").forEach(b => b.onclick = () => {
    pull();
    const si = +b.closest("[data-sec]").dataset.sec;
    draft.sections[si].items.splice(+b.dataset.delitem,1);
    if (!draft.sections[si].items.length) draft.sections[si].items.push({amount:"",unit:"g",name:"",ref:""});
    drawEdit();
  });
  wrap.querySelectorAll(".ref").forEach(s => s.onchange = () => { pull(); drawEdit(); });
  wrap.querySelectorAll(".amt, .unit").forEach(el => el.onchange = () => { pull(); drawEdit(); });
}

function drawSteps(){
  const wrap = $("stepWrap");
  wrap.innerHTML = draft.steps.map((t,i) => `
    <div class="ing-row" data-step="${i}">
      <textarea class="stp" style="flex:1;min-height:62px;background:var(--paper);border:1px solid var(--line-strong);border-radius:var(--r);padding:8px 10px" placeholder="Describe this step">${esc(t)}</textarea>
      <button class="icon-btn" data-delstep="${i}" aria-label="Remove step">×</button>
    </div>`).join("");
  wrap.querySelectorAll("[data-delstep]").forEach(b => b.onclick = () => {
    pull(); draft.steps.splice(+b.dataset.delstep,1);
    if (!draft.steps.length) draft.steps.push("");
    drawEdit();
  });
}

/* read the DOM back into the draft so re-renders don't lose typing */
function pull(){
  draft.emoji = $("fEmoji").value.trim();
  draft.name = $("fName").value.trim();
  const newType = $("fNewType").value.trim();
  draft.type = newType || $("fType").value;
  draft.servings = Math.max(1, num($("fServings").value)||1);
  draft.tags = $("fTags").value.split(",").map(s=>s.trim()).filter(Boolean);
  draft.notes = $("fNotes").value.trim();
  if ($("mKcal")) {
    draft.macros = {
      kcal: $("mKcal").value, protein: $("mPro").value,
      fat: $("mFat").value, carbs: $("mCarb").value, fiber: $("mFib").value
    };
  }
  draft.sections = [...$("secWrap").querySelectorAll("[data-sec]")].map(g => ({
    title: g.querySelector(".sec-title").value.trim(),
    items: [...g.querySelectorAll(".ing-item")].map(row => ({
      amount: row.querySelector(".amt").value === "" ? "" : num(row.querySelector(".amt").value),
      unit: row.querySelector(".unit").value,
      name: row.querySelector(".nm").value.trim(),
      ref: row.querySelector(".ref").value
    }))
  }));
  draft.steps = [...$("stepWrap").querySelectorAll(".stp")].map(t => t.value.trim());
}

async function commit(){
  pull();
  if (!draft.name) { toast("Give the recipe a name"); $("fName").focus(); return; }
  draft.sections = draft.sections
    .map(s => ({ title: s.title, items: s.items.filter(i => i.name) }))
    .filter(s => s.items.length);
  draft.steps = draft.steps.filter(Boolean);
  draft.updated = today();

  const logInput = $("fLog");
  if (logInput && logInput.value.trim()) {
    draft.log = draft.log || [];
    draft.log.push({ date: today(), note: logInput.value.trim() });
  }

  if (editingId) {
    const i = recipes.findIndex(r => r.id === editingId);
    recipes[i] = draft;
  } else {
    recipes.push(draft);
  }
  await save(editingId ? "Saved changes" : "Added to book");
  $("editDlg").close();
  render();
}

/* ---------- pantry ---------- */
let pantryReturnToEdit = false;
let pantryEditId = null;
let pantryQuery = "";

function openPantry(returnToEdit = false){
  pantryReturnToEdit = returnToEdit;
  pantryEditId = null;
  drawPantry();
  $("pantryDlg").showModal();
}

function drawPantry(){
  if (pantryEditId !== null) return drawPantryForm();
  const q = pantryQuery.toLowerCase();
  const list = pantry
    .filter(p => !q || pantryLabel(p).toLowerCase().includes(q))
    .sort((a,b) => pantryLabel(a).localeCompare(pantryLabel(b)));

  $("pantrySheet").innerHTML = `
    <div class="sheet-head">
      <div><h2>Pantry</h2>
      <div class="sheet-sub">${pantry.length} ingredient${pantry.length===1?"":"s"}. Macros here drive every recipe set to calculate.</div></div>
      <button class="close" id="pClose" aria-label="Close">×</button>
    </div>
    <div class="sheet-body">
      <div class="ing-row" style="margin-bottom:14px">
        <input class="nm" id="pQ" value="${esc(pantryQuery)}" placeholder="Search pantry" aria-label="Search pantry">
        <button class="btn btn-sm btn-primary" id="pAdd">Add</button>
      </div>
      ${list.length ? list.map(p => `
        <button class="pantry-row" data-pid="${esc(p.id)}">
          <span>
            <strong>${esc(p.name)}</strong>
            ${p.brand ? `<span class="brandtag">${esc(p.brand)}</span>` : ""}
            <span class="pantry-macros">${Math.round(num(p.kcal))} kcal · P ${r1(num(p.protein))} · F ${r1(num(p.fat))} · C ${r1(num(p.carbs))} · Fib ${r1(num(p.fiber))} ${esc(BASIS_LABEL[p.basis])}</span>
          </span>
        </button>`).join("")
        : `<p class="hint">Nothing matches that search.</p>`}
      <p class="hint" style="margin-top:18px">Entries marked "verify label" are generic reference values. Swap in the numbers from the package you actually buy — that's the whole point of the pantry.</p>
    </div>`;

  $("pClose").onclick = closePantry;
  $("pQ").oninput = e => { pantryQuery = e.target.value; drawPantry(); const box=$("pQ"); box.focus(); box.setSelectionRange(box.value.length,box.value.length); };
  $("pAdd").onclick = () => { pantryEditId = "new"; drawPantry(); };
  $("pantrySheet").querySelectorAll("[data-pid]").forEach(b => b.onclick = () => { pantryEditId = b.dataset.pid; drawPantry(); });
}

function drawPantryForm(){
  const isNew = pantryEditId === "new";
  const p = isNew
    ? { id:uid(), name:"", brand:"", basis:"100g", kcal:"", protein:"", fat:"", carbs:"", fiber:"" }
    : pantry.find(x => x.id === pantryEditId);
  if (!p) { pantryEditId = null; return drawPantry(); }

  $("pantrySheet").innerHTML = `
    <div class="sheet-head">
      <div><h2>${isNew ? "New pantry item" : "Edit pantry item"}</h2>
      <div class="sheet-sub">Copy the numbers straight off the nutrition label.</div></div>
      <button class="close" id="pClose2" aria-label="Close">×</button>
    </div>
    <div class="sheet-body">
      <div class="row">
        <div class="field" style="flex:2 1 200px"><label for="pName">Ingredient</label><input id="pName" value="${esc(p.name)}" placeholder="Greek yogurt, 0%"></div>
        <div class="field" style="flex:2 1 200px"><label for="pBrand">Brand</label><input id="pBrand" value="${esc(p.brand)}" placeholder="Fage Total"></div>
      </div>
      <div class="field">
        <label for="pBasis">These numbers are</label>
        <select id="pBasis">
          <option value="100g" ${p.basis==="100g"?"selected":""}>per 100 g</option>
          <option value="100ml" ${p.basis==="100ml"?"selected":""}>per 100 ml</option>
          <option value="each" ${p.basis==="each"?"selected":""}>per piece</option>
        </select>
        <div class="hint">If the label lists a serving size like 170g, divide by 1.7 to get per 100g.</div>
      </div>
      <div class="row">
        <div class="field"><label for="pKcal">Calories</label><input id="pKcal" type="number" step="0.1" value="${esc(p.kcal)}"></div>
        <div class="field"><label for="pPro">Protein (g)</label><input id="pPro" type="number" step="0.1" value="${esc(p.protein)}"></div>
        <div class="field"><label for="pFat">Fat (g)</label><input id="pFat" type="number" step="0.1" value="${esc(p.fat)}"></div>
        <div class="field"><label for="pCarb">Carbs (g)</label><input id="pCarb" type="number" step="0.1" value="${esc(p.carbs)}"></div>
        <div class="field"><label for="pFib">Fiber (g)</label><input id="pFib" type="number" step="0.1" value="${esc(p.fiber)}"></div>
      </div>
      <div class="sheet-actions">
        <button class="btn btn-primary" id="pSave">${isNew ? "Add to pantry" : "Save"}</button>
        <button class="btn" id="pBack">Back to list</button>
        ${isNew ? "" : `<button class="btn btn-danger" id="pDel">Delete</button>`}
      </div>
      ${isNew ? "" : `<p class="hint" style="margin-top:10px">${usageCount(p.id)} recipe${usageCount(p.id)===1?"":"s"} use this.</p>`}
    </div>`;

  $("pClose2").onclick = closePantry;
  $("pBack").onclick = () => { pantryEditId = null; drawPantry(); };
  $("pSave").onclick = async () => {
    const name = $("pName").value.trim();
    if (!name) { $("pName").focus(); return; }
    const rec = {
      id: p.id, name, brand: $("pBrand").value.trim(), basis: $("pBasis").value,
      kcal: num($("pKcal").value), protein: num($("pPro").value), fat: num($("pFat").value),
      carbs: num($("pCarb").value), fiber: num($("pFib").value)
    };
    const i = pantry.findIndex(x => x.id === p.id);
    if (i > -1) pantry[i] = rec; else pantry.push(rec);
    await save(isNew ? "Added to pantry" : "Pantry updated");
    pantryEditId = null; drawPantry(); render();
  };
  const del = $("pDel");
  if (del) del.onclick = async () => {
    if (del.dataset.armed !== "1") {
      del.dataset.armed = "1"; del.textContent = "Tap again to delete";
      setTimeout(()=>{ if(del.isConnected){ del.dataset.armed="0"; del.textContent="Delete"; } }, 4000);
      return;
    }
    if (!deleted.includes(p.id)) deleted.push(p.id);
    pantry = pantry.filter(x => x.id !== p.id);
    recipes.forEach(r => (r.sections||[]).forEach(s => (s.items||[]).forEach(it => { if (it.ref === p.id) it.ref = ""; })));
    await save("Removed from pantry");
    pantryEditId = null; drawPantry(); render();
  };
}

function usageCount(id){
  return recipes.filter(r => (r.sections||[]).some(s => (s.items||[]).some(it => it.ref === id))).length;
}

function closePantry(){
  $("pantryDlg").close();
  if (pantryReturnToEdit) { pantryReturnToEdit = false; drawEdit(); }
  render();
}

/* ---------- export / import ---------- */
function exportJSON(){
  const json = JSON.stringify({ recipes, pantry, deleted }, null, 2);
  $("dataSheet").innerHTML = `
    <div class="sheet-head">
      <div><h2>Back up your book</h2>
      <div class="sheet-sub">${recipes.length} recipe${recipes.length===1?"":"s"} and ${pantry.length} pantry item${pantry.length===1?"":"s"}. Copy this text and paste it anywhere safe — a note, an email to yourself, a chat.</div></div>
      <button class="close" id="dClose" aria-label="Close">×</button>
    </div>
    <div class="sheet-body">
      <textarea id="dataOut" readonly style="width:100%;min-height:200px;background:var(--paper);border:1px solid var(--line-strong);border-radius:var(--r);padding:10px;font-size:12px;line-height:1.4">${esc(json)}</textarea>
      <div class="sheet-actions" style="margin-top:12px">
        <button class="btn btn-primary" id="copyBtn">Copy all</button>
        <button class="btn" id="dlBtn">Download as file</button>
      </div>
      <h3 class="section-title">Restore from a backup</h3>
      <p class="hint" style="margin-bottom:8px">Paste a backup below to load it back in. Recipes already here are updated, new ones are added, nothing is wiped.</p>
      <textarea id="dataIn" placeholder="Paste backup text here" style="width:100%;min-height:110px;background:var(--paper);border:1px solid var(--line-strong);border-radius:var(--r);padding:10px;font-size:12px"></textarea>
      <div class="sheet-actions" style="margin-top:10px">
        <button class="btn" id="pasteImport">Restore from text</button>
        <button class="btn" id="fileImport">Pick a file instead</button>
      </div>
    </div>`;

  $("dClose").onclick = () => $("dataDlg").close();
  $("copyBtn").onclick = async () => {
    const ta = $("dataOut");
    try {
      await navigator.clipboard.writeText(json);
      toast("Copied — paste it somewhere safe");
    } catch(e){
      ta.focus(); ta.select();
      try { document.execCommand("copy"); toast("Copied"); }
      catch(e2){ toast("Select the text and copy it manually"); }
    }
  };
  $("dlBtn").onclick = () => {
    try {
      const blob = new Blob([json], {type:"application/json"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `recipe-book-${today()}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
      toast("Check your Downloads or Files app");
    } catch(e){ toast("Download blocked here — use Copy all instead"); }
  };
  $("pasteImport").onclick = () => {
    const text = $("dataIn").value.trim();
    if (!text) { $("dataIn").focus(); return; }
    mergeIn(text);
  };
  $("fileImport").onclick = () => $("importFile").click();

  $("dataDlg").showModal();
}

function mergeIn(text){
  try {
    const parsed = JSON.parse(text);
    const incoming = Array.isArray(parsed) ? parsed : (parsed.recipes || []);
    const inPantry = Array.isArray(parsed) ? [] : (parsed.pantry || []);
    if (!incoming.length && !inPantry.length) throw new Error("empty");
    let added = 0, updated = 0, pAdded = 0;
    inPantry.forEach(p => {
      if (!p || !p.name) return;
      if (p.id) deleted = deleted.filter(d => d !== p.id);
      const i = p.id ? pantry.findIndex(x => x.id === p.id) : -1;
      if (i > -1) pantry[i] = p;
      else { p.id = p.id || uid(); pantry.push(p); pAdded++; }
    });
    incoming.forEach(r => {
      if (!r || !r.name) return;
      if (r.id) deleted = deleted.filter(d => d !== r.id);
      const i = r.id ? recipes.findIndex(x => x.id === r.id) : -1;
      if (i > -1) { recipes[i] = r; updated++; }
      else { r.id = r.id || uid(); recipes.push(r); added++; }
    });
    save(false);
    render();
    $("dataDlg").close();
    toast(`Restored ${added} new, ${updated} updated${pAdded ? `, ${pAdded} pantry` : ""}`);
  } catch(e){
    toast("That text isn't a recipe backup");
  }
}

async function importJSON(file){
  try { mergeIn(await file.text()); }
  catch(e){ toast("Couldn't read that file"); }
}

/* ---------- wiring ---------- */
$("addBtn").onclick = () => openEdit(null);
$("exportBtn").onclick = exportJSON;
$("pantryBtn").onclick = () => openPantry(false);
$("importFile").onchange = e => { if (e.target.files[0]) importJSON(e.target.files[0]); e.target.value = ""; };

$("q").oninput = e => { filters.q = e.target.value.trim(); render(); };
$("sort").onchange = e => { filters.sort = e.target.value; render(); };
$("maxKcal").oninput = e => { filters.maxKcal = e.target.value === "" ? null : num(e.target.value); render(); };
$("minPro").oninput = e => { filters.minPro = e.target.value === "" ? null : num(e.target.value); render(); };
$("minRating").onchange = e => { filters.minRating = parseInt(e.target.value,10); render(); };

document.addEventListener("keydown", e => {
  if (e.key === "Escape") return;
  if (e.key === "/" && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA") {
    e.preventDefault(); $("q").focus();
  }
});

(async function init(){
  $("storageNote").textContent = STORAGE_NOTE[backend.name];
  await load();
  render();
})();
</script>
